name: Publish Docker image

on:
  push:
    branches:
      - main
      - codex/ch341-mfi-backend
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python and hardware backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libusb build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: hardware-backend/go.sum

      - name: Run Go tests with race detector
        working-directory: hardware-backend
        run: go test -race ./...

      - name: Run Go vet
        working-directory: hardware-backend
        run: go vet ./...

  smoke:
    name: Preflight final image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Determine build identity
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="sha-$COMMIT"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build final image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: remote-mfi-preflight:local
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.date }}
          cache-from: type=gha

      - name: Verify final image startup and identity
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' remote-mfi-preflight:local)" = '10001:10001'
          result=$(docker run --rm --platform "$PLATFORM" remote-mfi-preflight:local /usr/local/bin/mfi-backend --version)
          printf '%s\n' "$result"
          case "$result" in *"version=$VERSION commit=$COMMIT "*) ;; *) exit 1 ;; esac
          docker run --rm --platform "$PLATFORM" --entrypoint sh remote-mfi-preflight:local -c 'ldd /usr/local/bin/mfi-backend > /tmp/links && cat /tmp/links && ! grep -q "not found" /tmp/links && test -f /usr/share/doc/remote-mfi/hardware-backend/LICENSE && test -f /usr/share/doc/remote-mfi/hardware-backend/vendor/github.com/google/gousb/LICENSE && test -f /usr/share/doc/remote-mfi/licenses/go-LICENSE && test -f /usr/share/doc/remote-mfi/Dockerfile'

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: hanfu1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: hanfu1997/remote-mfi-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Determine build identity
        id: identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="sha-$COMMIT"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push uniquely named candidate
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hanfu1997/remote-mfi-server:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify candidate digest on both architectures
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          image="hanfu1997/remote-mfi-server@$DIGEST"
          manifest=$(docker buildx imagetools inspect --raw "$image")
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            child=$(printf '%s' "$manifest" | jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("expected one architecture manifest") end')
            arch_image="hanfu1997/remote-mfi-server@$child"
            result=$(docker run --rm --platform "$platform" "$arch_image" /usr/local/bin/mfi-backend --version)
            printf '%s: %s\n' "$platform" "$result"
            case "$result" in *"version=$VERSION commit=$COMMIT "*) ;; *) exit 1 ;; esac
            docker run --rm --platform "$platform" --entrypoint sh "$arch_image" -c 'ldd /usr/local/bin/mfi-backend > /tmp/links && ! grep -q "not found" /tmp/links && test "$(id -u)" = 10001 && test -f /usr/share/doc/remote-mfi/licenses/go-LICENSE && test -f /usr/share/doc/remote-mfi/hardware-backend/vendor/github.com/google/gousb/LICENSE'
          done

      - name: Promote verified candidate
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "hanfu1997/remote-mfi-server@$DIGEST"
