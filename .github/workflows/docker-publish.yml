name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python and hardware backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install libusb build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: hardware-backend/go.sum

      - name: Run Go tests with race detector
        working-directory: hardware-backend
        run: go test -race ./...

      - name: Run Go vet
        working-directory: hardware-backend
        run: go vet ./...

  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: hanfu1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: hanfu1997/remote-mfi-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test amd64 image
        run: >-
          docker run --rm --platform linux/amd64
          "hanfu1997/remote-mfi-server@${{ steps.build.outputs.digest }}"
          /usr/local/bin/mfi-backend --version

      - name: Smoke test arm64 image under QEMU
        run: >-
          docker run --rm --platform linux/arm64
          "hanfu1997/remote-mfi-server@${{ steps.build.outputs.digest }}"
          /usr/local/bin/mfi-backend --version
