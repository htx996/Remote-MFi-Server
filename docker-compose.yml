services:
  remote-mfi-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REMOTE_MFI_IMAGE:-remote-mfi-server:local}
    container_name: remote-mfi-server
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${REMOTE_MFI_PORT:-8765}:8000"
    volumes:
      # 可选外部后端目录；仅当管理员显式覆盖 MFI_BACKEND_COMMAND 时使用。
      - ./backend:/opt/remote-mfi/backend:ro
      - ./secrets:/run/secrets/remote-mfi:ro
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
